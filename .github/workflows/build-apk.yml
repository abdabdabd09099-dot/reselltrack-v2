name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Node ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── 3. Setup Java ────────────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 5. Build React app ───────────────────────────────────────────────────
      - name: Build React (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
        run: npm run build

      # ── 6. Sync Capacitor ────────────────────────────────────────────────────
      - name: Capacitor sync
        run: npx cap sync android

      # ── 7. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 8. Build debug APK ───────────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # ── 9. Upload APK as artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResellTrack-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Create GitHub Release with APK ───────────────────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ResellTrack v${{ github.run_number }}
          body: |
            ## ResellTrack Android APK
            Auto-built from commit ${{ github.sha }}

            ### What's included
            - 📊 Dashboard with live charts
            - 🛍️ Sales with 2-hour edit window
            - 📦 Product catalog & stock tracking
            - 💸 Expense tracking
            - 🤝 Lend / Borrow ledger
            - 📈 Reports with Sales Transaction Log
            - ⚙️ 6 Themes, 14 Currencies, 2 Languages
            - 🔐 Supabase Auth

            ### Install
            Download `ResellTrack-debug.apk` below and install on your Android device.
            *(Enable "Install from unknown sources" in Android Settings first)*
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
